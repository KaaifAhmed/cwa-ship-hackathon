services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-main_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis_server
    ports:
      - "6379:6379"

  main-service:
    build: ./main-service
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis_server:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    volumes:
      - ./main-service:/app
      - media_data:/app/media
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--reload"]

  ai-worker:
    build:
      context: .
      dockerfile: ai-worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis_server:6379/0
      MAIN_SERVICE_URL: http://main-service:8000
      WHATSAPP_SERVICE_URL: http://whatsapp-service:3000
      JOB_CALLBACK_URL: http://main-service:8000/api/internal/worker-result
    volumes:
      - ./ai-worker:/app
      - ./shared:/app/shared
    depends_on:
      - redis
      - main-service
    command: ["python", "main.py"]

  background-worker:
    build:
      context: .
      dockerfile: background-worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis_server:6379/0
      MAIN_SERVICE_URL: http://main-service:8000
      WHATSAPP_SERVICE_URL: http://whatsapp-service:3000
    volumes:
      - ./background-worker:/app
      - ./shared:/app/shared
    depends_on:
      - redis
      - main-service
    command: ["python", "main.py"]

  whatsapp-service:
    build: ./whatsapp-service
    env_file: ./whatsapp-service/.env
    environment:
      PORT: 3000
      AUTH_DIR: /app/auth/whatsapp
      MAIN_SERVICE_INBOUND_URL: http://main-service:8000/api/whatsapp/inbound
    ports:
      - "3000:3000"
    volumes:
      - whatsapp_auth:/app/auth
    depends_on:
      - main-service

  frontend:
    build: ./frontend
    ports:
      - "5173:3000"
    depends_on:
      - main-service

volumes:
  pgdata:
  media_data:
  whatsapp_auth:
